name: Syntax Verify

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    name: Verify repo syntax
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install --upgrade pyyaml

      - name: Install HAProxy (for full config validation)
        run: sudo apt-get update && sudo apt-get install -y haproxy

      - name: Run gh_verify.py
        run: python3 scripts/gh_verify.py . --exclude .git,node_modules,vendor
