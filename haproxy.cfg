global
    log stdout format raw local0
    maxconn 20000
    nbthread 4
    tune.ssl.default-dh-param 2048
    tune.bufsize 32768
    tune.maxrewrite 4096
    spread-checks 5

defaults
    log global
    mode http
    option httplog
    option dontlognull
    option redispatch
    retries 3
    timeout connect 10s
    timeout client 3600s
    timeout server 3600s
    timeout tunnel 3600s
    timeout http-request 10s
    timeout http-keep-alive 300s
    timeout queue 5s
    timeout check 5s
    default-server init-addr last,libc,none

frontend http_in
    bind :8080
    mode http

    # Healthcheck for Cloud Run
    acl is_health path /health
    http-request return status 200 content-type "text/plain" string "OK" if is_health

    # gRPC Routes
    use_backend trojan_grpc if { path_beg /saeka-tojirp-grpc }
    use_backend vmess_grpc if { path_beg /vmess-saeka-grpc }
    use_backend vless_grpc if { path_beg /vless-saeka-grpc }
    use_backend ss_grpc if { path_beg /ss-saeka-grpc }

    # XHTTP Routes
    use_backend trojan_xh if { path_beg /saeka-tojirp-xh }
    use_backend vmess_xh if { path_beg /vmess-saeka-xh }
    use_backend vless_xh if { path_beg /vless-saeka-xh }
    use_backend ss_xh if { path_beg /ss-saeka-xh }

    # HTTPUpgrade Routes
    use_backend trojan_hu if { path_beg /saeka-tojirp-hu }
    use_backend vmess_hu if { path_beg /vmess-saeka-hu }
    use_backend vless_hu if { path_beg /vless-saeka-hu }
    use_backend ss_hu if { path_beg /ss-saeka-hu }

    # WebSocket Routes
    use_backend trojan_ws if { path_beg /saeka-tojirp }
    use_backend vmess_ws if { path_beg /vmess-saeka }
    use_backend vless_ws if { path_beg /vless-saeka }
    use_backend ss_ws if { path_beg /ss-saeka }

    default_backend web_root

# --- gRPC Backends ---
backend trojan_grpc
    mode http
    http-reuse never
    server s1 127.0.0.1:10012 proto h2 check
backend vmess_grpc
    mode http
    http-reuse never
    server s1 127.0.0.1:10013 proto h2 check
backend vless_grpc
    mode http
    http-reuse never
    server s1 127.0.0.1:10014 proto h2 check
backend ss_grpc
    mode http
    http-reuse never
    server s1 127.0.0.1:10015 proto h2 check

# --- XHTTP Backends ---
backend trojan_xh
    mode http
    http-reuse safe
    server s1 127.0.0.1:10002 check
backend vmess_xh
    mode http
    http-reuse safe
    server s1 127.0.0.1:10005 check
backend vless_xh
    mode http
    http-reuse safe
    server s1 127.0.0.1:10008 check
backend ss_xh
    mode http
    http-reuse safe
    server s1 127.0.0.1:10011 check

# --- HTTPUpgrade Backends ---
# Fix: these MUST NOT reuse connections. httpupgrade is a one-shot
# 101 Switching Protocols handshake that then becomes a raw byte tunnel.
# http-reuse (even "safe") can hand a *pooled* connection back for a
# request expecting Upgrade, which either hangs or gets a broken tunnel.
# Also disable server-side keep-alive explicitly so the tunnel isn't
# torn down/recycled mid-stream.
backend trojan_hu
    mode http
    http-reuse never
    option http-no-delay
    timeout tunnel 3600s
    server s1 127.0.0.1:10001 check
backend vmess_hu
    mode http
    http-reuse never
    option http-no-delay
    timeout tunnel 3600s
    server s1 127.0.0.1:10004 check
backend vless_hu
    mode http
    http-reuse never
    option http-no-delay
    timeout tunnel 3600s
    server s1 127.0.0.1:10007 check
backend ss_hu
    mode http
    http-reuse never
    option http-no-delay
    timeout tunnel 3600s
    server s1 127.0.0.1:10010 check

# --- WebSocket Backends ---
backend trojan_ws
    mode http
    http-reuse never
    option http-no-delay
    server s1 127.0.0.1:10000 check
backend vmess_ws
    mode http
    http-reuse never
    option http-no-delay
    server s1 127.0.0.1:10003 check
backend vless_ws
    mode http
    http-reuse never
    option http-no-delay
    server s1 127.0.0.1:10006 check
backend ss_ws
    mode http
    http-reuse never
    option http-no-delay
    server s1 127.0.0.1:10009 check

# --- Fallback Root ---
backend web_root
    mode http
    server s1 127.0.0.1:80 check
