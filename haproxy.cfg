global
    log stdout format raw local0
    maxconn 10000

defaults
    log global
    mode http
    option httplog
    option dontlognull
    timeout connect 10s
    timeout client 3600s
    timeout server 3600s
    timeout tunnel 3600s
    timeout http-request 10s
    timeout http-keep-alive 300s

frontend http_in
    bind :8080
    mode http

    # Healthcheck for Cloud Run
    acl is_health path /health
    http-request return status 200 content-type "text/plain" string "OK" if is_health

    # gRPC Routes
    use_backend trojan_grpc if { path_beg /saeka-tojirp-grpc }
    use_backend vmess_grpc if { path_beg /vmess-saeka-grpc }
    use_backend vless_grpc if { path_beg /vless-saeka-grpc }
    use_backend ss_grpc if { path_beg /ss-saeka-grpc }

    # XHTTP Routes (more specific paths first so /vless-saeka-xh2 isn't
    # swallowed by /vless-saeka-xh's prefix match)
    use_backend trojan_xh if { path_beg /saeka-tojirp-xh }
    use_backend vmess_xh if { path_beg /vmess-saeka-xh }
    use_backend vless_xh2 if { path_beg /vless-saeka-xh2 }
    use_backend vless_xh_dl if { path_beg /vless-saeka-xh-dl }
    use_backend vless_xh if { path_beg /vless-saeka-xh }
    use_backend ss_xh if { path_beg /ss-saeka-xh }

    # HTTPUpgrade Routes
    use_backend trojan_hu if { path_beg /saeka-tojirp-hu }
    use_backend vmess_hu if { path_beg /vmess-saeka-hu }
    use_backend vless_hu if { path_beg /vless-saeka-hu }
    use_backend ss_hu if { path_beg /ss-saeka-hu }

    # WebSocket Routes
    use_backend trojan_ws if { path_beg /saeka-tojirp }
    use_backend vmess_ws if { path_beg /vmess-saeka }
    use_backend vless_ws if { path_beg /vless-saeka }
    use_backend ss_ws if { path_beg /ss-saeka }

    default_backend web_root

# --- gRPC Backends ---
backend trojan_grpc
    mode http
    server s1 127.0.0.1:10012 proto h2
backend vmess_grpc
    mode http
    server s1 127.0.0.1:10013 proto h2
backend vless_grpc
    mode http
    server s1 127.0.0.1:10014 proto h2
backend ss_grpc
    mode http
    server s1 127.0.0.1:10015 proto h2

# --- XHTTP Backends ---
backend trojan_xh
    mode http
    option http-keep-alive
    timeout server 3600s
    server s1 127.0.0.1:10002
backend vmess_xh
    mode http
    option http-keep-alive
    timeout server 3600s
    server s1 127.0.0.1:10005
backend vless_xh
    mode http
    option http-keep-alive
    timeout server 3600s
    server s1 127.0.0.1:10008
backend vless_xh_dl
    mode http
    option http-keep-alive
    timeout server 3600s
    server s1 127.0.0.1:10008
backend vless_xh2
    mode http
    option http-keep-alive
    timeout server 3600s
    server s1 127.0.0.1:10016
backend ss_xh
    mode http
    option http-keep-alive
    timeout server 3600s
    server s1 127.0.0.1:10011

# --- HTTPUpgrade Backends ---
backend trojan_hu
    mode http
    server s1 127.0.0.1:10001
backend vmess_hu
    mode http
    server s1 127.0.0.1:10004
backend vless_hu
    mode http
    server s1 127.0.0.1:10007
backend ss_hu
    mode http
    server s1 127.0.0.1:10010

# --- WebSocket Backends ---
backend trojan_ws
    mode http
    server s1 127.0.0.1:10000
backend vmess_ws
    mode http
    server s1 127.0.0.1:10003
backend vless_ws
    mode http
    server s1 127.0.0.1:10006
backend ss_ws
    mode http
    server s1 127.0.0.1:10009

# --- Fallback Root ---
backend web_root
    mode http
    server s1 127.0.0.1:80
