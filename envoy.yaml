static_resources:
  listeners:
  - name: listener_0
    address:
      socket_address:
        address: 0.0.0.0
        port_value: 8080
    filter_chains:
    - filters:
      - name: envoy.filters.network.http_connection_manager
        typed_config:
          "@type": type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.v3.HttpConnectionManager
          stat_prefix: ingress_http
          codec_type: AUTO
          upgrade_configs:
          - upgrade_type: websocket
          route_config:
            name: local_route
            virtual_hosts:
            - name: local_service
              domains: ["*"]
              routes:
              # Health check
              - match: { prefix: "/health" }
                direct_response: { status: 200, body: { inline_string: "OK" } }
              
              # Trojan
              - match: { prefix: "/saeka-tojirp" }
                route: { cluster: xray_10000 }
              - match: { prefix: "/saeka-tojirp-hu" }
                route: { cluster: xray_10001 }
              - match: { prefix: "/saeka-tojirp-xh" }
                route: { cluster: xray_10002 }
              - match: { prefix: "/saeka-tojirp-grpc" }
                route: { cluster: xray_10012 }

              # VMess
              - match: { prefix: "/vmess-saeka" }
                route: { cluster: xray_10003 }
              - match: { prefix: "/vmess-saeka-hu" }
                route: { cluster: xray_10004 }
              - match: { prefix: "/vmess-saeka-xh" }
                route: { cluster: xray_10005 }
              - match: { prefix: "/vmess-saeka-grpc" }
                route: { cluster: xray_10013 }

              # VLESS
              - match: { prefix: "/vless-saeka" }
                route: { cluster: xray_10006 }
              - match: { prefix: "/vless-saeka-hu" }
                route: { cluster: xray_10007 }
              - match: { prefix: "/vless-saeka-xh" }
                route: { cluster: xray_10008 }
              - match: { prefix: "/vless-saeka-grpc" }
                route: { cluster: xray_10014 }

              # Shadowsocks
              - match: { prefix: "/ss-saeka" }
                route: { cluster: xray_10009 }
              - match: { prefix: "/ss-saeka-hu" }
                route: { cluster: xray_10010 }
              - match: { prefix: "/ss-saeka-xh" }
                route: { cluster: xray_10011 }
              - match: { prefix: "/ss-saeka-grpc" }
                route: { cluster: xray_10015 }

          http_filters:
          - name: envoy.filters.http.router
            typed_config:
              "@type": type.googleapis.com/envoy.extensions.filters.http.router.v3.Router

  clusters:
  # HTTP/1.1 & WebSocket Clusters
  - name: xray_10000
    type: STATIC
    lb_policy: ROUND_ROBIN
    load_assignment:
      cluster_name: xray_10000
      endpoints:
      - lb_endpoints:
        - endpoint: { socket_address: { address: 127.0.0.1, port_value: 10000 } }
  - name: xray_10001
    type: STATIC
    lb_policy: ROUND_ROBIN
    load_assignment:
      cluster_name: xray_10001
      endpoints:
      - lb_endpoints:
        - endpoint: { socket_address: { address: 127.0.0.1, port_value: 10001 } }
  - name: xray_10002
    type: STATIC
    lb_policy: ROUND_ROBIN
    load_assignment:
      cluster_name: xray_10002
      endpoints:
      - lb_endpoints:
        - endpoint: { socket_address: { address: 127.0.0.1, port_value: 10002 } }
  - name: xray_10003
