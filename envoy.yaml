admin:
  address:
    socket_address:
      address: 127.0.0.1
      port_value: 9901

static_resources:
  listeners:
  - name: listener_0
    address:
      socket_address:
        address: 0.0.0.0
        port_value: 8080
    per_connection_buffer_limit_bytes: 32768000
    filter_chains:
    - filters:
      - name: envoy.filters.network.http_connection_manager
        typed_config:
          "@type": type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.v3.HttpConnectionManager
          stat_prefix: ingress_http
          # Critical: 0s prevents Envoy from dropping active streaming connections
          stream_idle_timeout: 0s
          request_timeout: 0s
          common_http_protocol_options:
            idle_timeout: 3600s
          http2_protocol_options:
            max_concurrent_streams: 10000
          upgrade_configs:
          - upgrade_type: websocket
          - upgrade_type: CONNECT
          route_config:
            name: local_route
            virtual_hosts:
            - name: local_service
              domains: ["*"]
              routes:
              # GRPC ROUTES
              - match: { prefix: "/saeka-tojirp-grpc" }
                route: { cluster: trojan_grpc, timeout: 0s }
              - match: { prefix: "/vmess-saeka-grpc" }
                route: { cluster: vmess_grpc, timeout: 0s }
              - match: { prefix: "/vless-saeka-grpc" }
                route: { cluster: vless_grpc, timeout: 0s }
              - match: { prefix: "/ss-saeka-grpc" }
                route: { cluster: ss_grpc, timeout: 0s }
              # XHTTP ROUTES
              - match: { prefix: "/saeka-tojirp-xh" }
                route: { cluster: trojan_xh, timeout: 0s }
              - match: { prefix: "/vmess-saeka-xh" }
                route: { cluster: vmess_xh, timeout: 0s }
              - match: { prefix: "/vless-saeka-xh" }
                route: { cluster: vless_xh, timeout: 0s }
              - match: { prefix: "/ss-saeka-xh" }
                route: { cluster: ss_xh, timeout: 0s }
              # HTTPUPGRADE ROUTES
              - match: { prefix: "/saeka-tojirp-hu" }
                route: { cluster: trojan_hu, timeout: 0s }
              - match: { prefix: "/vmess-saeka-hu" }
                route: { cluster: vmess_hu, timeout: 0s }
              - match: { prefix: "/vless-saeka-hu" }
                route: { cluster: vless_hu, timeout: 0s }
              - match: { prefix: "/ss-saeka-hu" }
                route: { cluster: ss_hu, timeout: 0s }
              # WEBSOCKET ROUTES
              - match: { prefix: "/saeka-tojirp" }
                route: { cluster: trojan_ws, timeout: 0s }
              - match: { prefix: "/vmess-saeka" }
                route: { cluster: vmess_ws, timeout: 0s }
              - match: { prefix: "/vless-saeka" }
                route: { cluster: vless_ws, timeout: 0s }
              - match: { prefix: "/ss-saeka" }
                route: { cluster: ss_ws, timeout: 0s }
              # FALLBACK
              - match: { prefix: "/" }
                route: { cluster: web_root, timeout: 30s }

  clusters:
  # --- GRPC CLUSTERS (Must retain http2_protocol_options to fix POST 404) ---
  - name: trojan_grpc
    connect_timeout: 10s
    type: STATIC
    http2_protocol_options: {}
    load_assignment:
      cluster_name: trojan_grpc
      endpoints: [{ lb_endpoints: [{ endpoint: { address: { socket_address: { address: 127.0.0.1, port_value: 10012 } } } }] }]
  - name: vmess_grpc
    connect_timeout: 10s
    type: STATIC
    http2_protocol_options: {}
    load_assignment:
      cluster_name: vmess_grpc
      endpoints: [{ lb_endpoints: [{ endpoint: { address: { socket_address: { address: 127.0.0.1, port_value: 10013 } } } }] }]
  - name: vless_grpc
    connect_timeout: 10s
    type: STATIC
    http2_protocol_options: {}
    load_assignment:
      cluster_name: vless_grpc
      endpoints: [{ lb_endpoints: [{ endpoint: { address: { socket_address: { address: 127.0.0.1, port_value: 10014 } } } }] }]
  - name: ss_grpc
    connect_timeout: 10s
    type: STATIC
    http2_protocol_options: {}
    load_assignment:
      cluster_name: ss_grpc
      endpoints: [{ lb_endpoints: [{ endpoint: { address: { socket_address: { address: 127.0.0.1, port_value: 10015 } } } }] }]

  # --- XHTTP CLUSTERS ---
  - name: trojan_xh
    connect_timeout: 10s
    type: STATIC
    load_assignment:
      cluster_name: trojan_xh
      endpoints: [{ lb_endpoints: [{ endpoint: { address: { socket_address: { address: 127.0.0.1, port_value: 10002 } } } }] }]
  - name: vmess_xh
    connect_timeout: 10s
    type: STATIC
    load_assignment:
      cluster_name: vmess_xh
      endpoints: [{ lb_endpoints: [{ endpoint: { address: { socket_address: { address: 127.0.0.1, port_value: 10005 } } } }] }]
  - name: vless_xh
    connect_timeout: 10s
    type: STATIC
    load_assignment:
      cluster_name: vless_xh
      endpoints: [{ lb_endpoints: [{ endpoint: { address: { socket_address: { address: 127.0.0.1, port_value: 10008 } } } }] }]
  - name: ss_xh
    connect_timeout: 10s
    type: STATIC
    load_assignment:
      cluster_name: ss_xh
      endpoints: [{ lb_endpoints: [{ endpoint: { address: { socket_address: { address: 127.0.0.1, port_value: 10011 } } } }] }]

  # --- HTTPUPGRADE CLUSTERS ---
  - name: trojan_hu
    connect_timeout: 10s
    type: STATIC
    load_assignment:
      cluster_name: trojan_hu
      endpoints: [{ lb_endpoints: [{ endpoint: { address: { socket_address: { address: 127.0.0.1, port_value: 10001 } } } }] }]
  - name: vmess_hu
    connect_timeout: 10s
    type: STATIC
    load_assignment:
      cluster_name: vmess_hu
      endpoints: [{ lb_endpoints: [{ endpoint: { address: { socket_address: { address: 127.0.0.1, port_value: 10004 } } } }] }]
  - name: vless_hu
    connect_timeout: 10s
    type: STATIC
    load_assignment:
      cluster_name: vless_hu
      endpoints: [{ lb_endpoints: [{ endpoint: { address: { socket_address: { address: 127.0.0.1, port_value: 10007 } } } }] }]
  - name: ss_hu
    connect_timeout: 10s
    type: STATIC
    load_assignment:
      cluster_name: ss_hu
      endpoints: [{ lb_endpoints: [{ endpoint: { address: { socket_address: { address: 127.0.0.1, port_value: 10010 } } } }] }]

  # --- WEBSOCKET CLUSTERS ---
  - name: trojan_ws
    connect_timeout: 10s
    type: STATIC
    load_assignment:
      cluster_name: trojan_ws
      endpoints: [{ lb_endpoints: [{ endpoint: { address: { socket_address: { address: 127.0.0.1, port_value: 10000 } } } }] }]
  - name: vmess_ws
    connect_timeout: 10s
    type: STATIC
    load_assignment:
      cluster_name: vmess_ws
      endpoints: [{ lb_endpoints: [{ endpoint: { address: { socket_address: { address: 127.0.0.1, port_value: 10003 } } } }] }]
  - name: vless_ws
    connect_timeout: 10s
    type: STATIC
    load_assignment:
      cluster_name: vless_ws
      endpoints: [{ lb_endpoints: [{ endpoint: { address: { socket_address: { address: 127.0.0.1, port_value: 10006 } } } }] }]
  - name: ss_ws
    connect_timeout: 10s
    type: STATIC
    load_assignment:
      cluster_name: ss_ws
      endpoints: [{ lb_endpoints: [{ endpoint: { address: { socket_address: { address: 127.0.0.1, port_value: 10009 } } } }] }]

  # --- WEB ROOT FALLBACK ---
  - name: web_root
    connect_timeout: 10s
    type: STATIC
    load_assignment:
      cluster_name: web_root
      endpoints: [{ lb_endpoints: [{ endpoint: { address: { socket_address: { address: 127.0.0.1, port_value: 80 } } } }] }]
