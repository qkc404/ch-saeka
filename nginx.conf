worker_processes auto;
# 1. Significantly increase file limits for high concurrency
worker_rlimit_nofile 1048576;

events {
    # 2. Increase worker connections
    worker_connections 100000;
    multi_accept on;
    use epoll;
}

http {
    include mime.types;
    default_type application/octet-stream;
    
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;

    keepalive_timeout 65;
    keepalive_requests 100000;
    reset_timedout_connection on;

    client_body_timeout 60s;
    client_header_timeout 60s;
    send_timeout 60s;

    server_tokens off;
    
    client_max_body_size 4096M;
    client_body_buffer_size 512k;

    resolver 8.8.8.8 1.1.1.1 valid=300s;
    resolver_timeout 3s;

    map $http_upgrade $connection_upgrade {
        default upgrade;
        '' close;
    }

    server {
        listen 8080 default_server backlog=65535 reuseport;
        http2 on;
        server_name _;

        sendfile_max_chunk 512k;

        location = /health {
            return 200 "OK";
            add_header Content-Type text/plain;
            access_log off;
        }

        location = / {
            root /usr/local/openresty/nginx/html;
            index index.html;
            access_log off;
        }

        # --- XHTTP / Standard Proxy Locations ---
        location ^~ /saeka-tojirp-xh {
            proxy_pass http://127.0.0.1:10002;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            
            # STABILITY FIXES FOR XHTTP:
            proxy_set_header Connection ""; # Prevents Nginx from closing the upstream connection
            proxy_socket_keepalive on;      # Keeps the TCP socket alive under heavy load
            proxy_connect_timeout 60s;
            
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
            proxy_buffering off;
            proxy_request_buffering off;
            chunked_transfer_encoding on;
        }
        
        # --- gRPC Locations ---
        location ^~ /saeka-tojirp-grpc {
            grpc_pass grpc://127.0.0.1:10012;
            grpc_read_timeout 3600s;
            grpc_send_timeout 3600s;
            grpc_buffer_size 512k;
        }

        # --- WebSocket / HTTP Upgrade Locations ---
        location ^~ /saeka-tojirp-hu {
            proxy_pass http://127.0.0.1:10001;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
            proxy_buffering off;
            proxy_request_buffering off;
        }

        location ^~ /saeka-tojirp {
