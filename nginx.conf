worker_processes auto;
worker_rlimit_nofile 65535;

events {
    worker_connections 16384;
    multi_accept on;
    use epoll;
}

http {
    include mime.types;
    default_type application/octet-stream;
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    keepalive_requests 10000;
    reset_timedout_connection on;
    client_body_timeout 10;
    client_header_timeout 10;
    send_timeout 10;
    server_tokens off;
    
    # Required for xhttp payload streaming
    client_max_body_size 0;

    resolver 8.8.8.8 1.1.1.1 valid=300s;
    resolver_timeout 3s;

    map $http_upgrade $connection_upgrade {
        default upgrade;
        '' close;
    }

    server {
        listen 8080 default_server backlog=4096;
        http2 on;
        server_name _;

        location = /health {
            return 200 "OK";
            add_header Content-Type text/plain;
            access_log off;
        }

        location = / {
            root /usr/local/openresty/nginx/html;
            index index.html;
            access_log off;
        }

        location ^~ /saeka-tojirp-xh {
            proxy_pass http://127.0.0.1:10002;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
            proxy_buffering off;
            proxy_request_buffering off;
        }
        location ^~ /saeka-tojirp-grpc {
            grpc_pass grpc://127.0.0.1:10012;
            grpc_read_timeout 3600s;
            grpc_send_timeout 3600s;
        }
        location ^~ /saeka-tojirp-hu {
            proxy_pass http://127.0.0.1:10001;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $host;
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
            proxy_buffering off;
        }
        location ^~ /saeka-tojirp {
            proxy_pass http://127.0.0.1:10000;
            proxy_http_version 1.1;
