user nginx;
worker_processes auto;
worker_rlimit_nofile 65535;
worker_rlimit_nproc 65535;
daemon off;

events {
    worker_connections 32768;
    use epoll;
    multi_accept on;
    accept_mutex off;
}

http {
    include mime.types;
    default_type application/octet-stream;
    
    # Core I/O
    sendfile on;
    sendfile_max_chunk 0;
    tcp_nopush on;
    tcp_nodelay on;
    
    # Buffering optimization (prevent EOF/timeout)
    client_body_buffer_size 1024k;
    client_max_body_size 4096m;
    client_header_buffer_size 32k;
    large_client_header_buffers 8 64k;
    
    # Upstream buffering
    proxy_buffer_size 256k;
    proxy_buffers 16 256k;
    proxy_busy_buffers_size 512k;
    proxy_temp_file_write_size 512k;
    
    # Timeouts (prevent dropout)
    client_body_timeout 120s;
    client_header_timeout 120s;
    send_timeout 120s;
    
    keepalive_timeout 120;
    keepalive_requests 200;
    reset_timedout_connection on;
    
    # DNS
    resolver 8.8.8.8 1.1.1.1 valid=300s ipv6=off;
    resolver_timeout 10s;
    
    # Connection upgrade header map
    map $http_upgrade $connection_upgrade {
        default upgrade;
        '' close;
    }
    
    # XHTTP mode detection
    map $request_uri $xhttp_mode {
        ~*-xh$ "xhttp";
        default "standard";
    }
    
    # Compression (disabled for binary protocols)
    gzip off;
    
    server {
        listen 8080 default_server backlog=65535 reuseport so_keepalive=120s:15s:6;
        http2 on;
        http2_max_field_size 256k;
        http2_max_header_size 512k;
        
        server_name _;
        server_tokens off;
        
        # Health check endpoint (no logging)
        location = /health {
            return 200 "OK\n";
            add_header Content-Type text/plain always;
            access_log off;
        }
        
        # Root decoy
        location = / {
            root /usr/local/openresty/nginx/html;
            index index.html;
            access_log off;
            add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        }
        
        # =====================================
        # TROJAN ENDPOINTS
        # =====================================
        
        # Trojan WS
        location ^~ /saeka-tojirp {
            proxy_pass http://127.0.0.1:10000;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            
            # Low-latency socket options
            proxy_socket_keepalive on;
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
            proxy_connect_timeout 30s;
            
            # Buffering (disabled for streaming)
            proxy_buffering off;
            proxy_request_buffering off;
            proxy_buffer_size 4k;
            
            # Connection reuse
            proxy_http_version 1.1;
            proxy_set_header Connection "";
        }
        
        # Trojan HTTP Upgrade
        location ^~ /saeka-tojirp-hu {
            proxy_pass http://127.0.0.1:10001;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            
            proxy_socket_keepalive on;
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
            proxy_connect_timeout 30s;
            proxy_buffering off;
            proxy_request_buffering off;
            proxy_buffer_size 4k;
        }
        
        # Trojan XHTTP (FIXED)
        location ^~ /saeka-tojirp-xh {
            proxy_pass http://127.0.0.1:10002;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header Connection "";
            
            # Critical for XHTTP stability
            proxy_socket_keepalive on;
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
            proxy_connect_timeout 30s;
            
            # Prevent chunked encoding issues
            proxy_buffering off;
            proxy_request_buffering off;
            chunked_transfer_encoding off;
            proxy_buffer_size 8k;
            proxy_buffers 32 8k;
            proxy_busy_buffers_size 16k;
            proxy_temp_file_write_size 32k;
            
            # No compression
            gzip off;
            
            # Preserve original request
            proxy_pass_request_headers on;
        }
        
        # Trojan gRPC
        location ^~ /saeka-tojirp-grpc {
            grpc_pass grpc://127.0.0.1:10012;
            grpc_socket_keepalive on;
            grpc_read_timeout 3600s;
            grpc_send_timeout 3600s;
            grpc_connect_timeout 30s;
            grpc_buffer_size 4k;
            grpc_max_recv_msg_size 512m;
            grpc_max_send_msg_size 512m;
        }
        
